<script>

var DB_NAME = "lotfabadi_filter_db";
var DB_VERSION = 6;

var customers = [];

var serviceHistory = [];

var currentFilter = "all";

/* =========================================================
   DATE HELPERS
========================================================= */

function isNumberChar(ch){
  return ch >= "0" && ch <= "9";
}

function onlyAsciiNumbers(value){

  var s = String(value || "");
  var result = "";

  for(var i = 0; i < s.length; i++){

    var code = s.charCodeAt(i);

    if(code >= 48 && code <= 57){

      result += s.charAt(i);

    }else if(code >= 1776 && code <= 1785){

      result += String(code - 1776);

    }else if(code >= 1632 && code <= 1641){

      result += String(code - 1632);

    }

  }

  return result;
}

function parseDateParts(value){

  if(!value){
    return null;
  }

  var s = String(value).trim();

  s = s.split("T")[0];
  s = s.split(" ")[0];
  s = s.replaceAll("-","/");

  var parts = s.split("/");

  if(parts.length < 3){
    return null;
  }

  var y = Number(
    onlyAsciiNumbers(parts[0])
  );

  var m = Number(
    onlyAsciiNumbers(parts[1])
  );

  var d = Number(
    onlyAsciiNumbers(parts[2])
  );

  if(!y || !m || !d){
    return null;
  }

  return {
    y:y,
    m:m,
    d:d
  };
}

function formatJalali(y,m,d){

  return (
    String(y).padStart(4,"0") +
    "/" +
    String(m).padStart(2,"0") +
    "/" +
    String(d).padStart(2,"0")
  );
}

/* =========================================================
   GREGORIAN -> JALALI
========================================================= */

function gregorianToJalali(gy,gm,gd){

  var gDaysInMonth = [
    31,28,31,30,31,30,
    31,31,30,31,30,31
  ];

  var jDaysInMonth = [
    31,31,31,31,31,31,
    30,30,30,30,30,29
  ];

  var gy2 = gy - 1600;
  var gm2 = gm - 1;
  var gd2 = gd - 1;

  var gDayNo =
    365 * gy2 +
    Math.floor((gy2 + 3) / 4) -
    Math.floor((gy2 + 99) / 100) +
    Math.floor((gy2 + 399) / 400);

  for(var i = 0; i < gm2; i++){
    gDayNo += gDaysInMonth[i];
  }

  if(
    gm2 > 1 &&
    (
      gy % 4 === 0 &&
      (
        gy % 100 !== 0 ||
        gy % 400 === 0
      )
    )
  ){
    gDayNo++;
  }

  gDayNo += gd2;

  var jDayNo =
    gDayNo - 79;

  var jNp =
    Math.floor(jDayNo / 12053);

  jDayNo =
    jDayNo % 12053;

  var jy =
    979 +
    33 * jNp +
    4 * Math.floor(jDayNo / 1461);

  jDayNo =
    jDayNo % 1461;

  if(jDayNo >= 366){

    jy +=
      Math.floor(
        (jDayNo - 1) / 365
      );

    jDayNo =
      (jDayNo - 1) % 365;
  }

  var jm = 0;

  while(
    jm < 11 &&
    jDayNo >= jDaysInMonth[jm]
  ){

    jDayNo -=
      jDaysInMonth[jm];

    jm++;
  }

  var jd =
    jDayNo + 1;

  return formatJalali(
    jy,
    jm + 1,
    jd
  );
}

/* =========================================================
   JALALI -> GREGORIAN
========================================================= */

function jalaliToGregorian(jy,jm,jd){

  var jy2 =
    jy - 979;

  var jDayNo =
    365 * jy2 +
    Math.floor(jy2 / 33) * 8 +
    Math.floor(
      ((jy2 % 33) + 3) / 4
    );

  for(
    var i = 1;
    i < jm;
    i++
  ){

    if(i <= 6){
      jDayNo += 31;
    }else{
      jDayNo += 30;
    }

  }

  jDayNo += jd - 1;

  var gDayNo =
    jDayNo + 79;

  var gy =
    1600 +
    400 *
    Math.floor(
      gDayNo / 146097
    );

  gDayNo =
    gDayNo % 146097;

  var leap = true;

  if(gDayNo >= 36525){

    gDayNo--;

    gy +=
      100 *
      Math.floor(
        gDayNo / 36524
      );

    gDayNo =
      gDayNo % 36524;

    if(gDayNo >= 365){

      gDayNo++;

    }else{

      leap = false;

    }
  }

  gy +=
    4 *
    Math.floor(
      gDayNo / 1461
    );

  gDayNo =
    gDayNo % 1461;

  if(gDayNo >= 366){

    leap = false;

    gDayNo--;

    gy +=
      Math.floor(
        gDayNo / 365
      );

    gDayNo =
      gDayNo % 365;
  }

  var monthDays = [
    31,
    leap ? 29 : 28,
    31,30,31,30,
    31,31,30,31,30,31
  ];

  var gm = 0;

  while(
    gm < 12 &&
    gDayNo >= monthDays[gm]
  ){

    gDayNo -=
      monthDays[gm];

    gm++;
  }

  var gd =
    gDayNo + 1;

  return {
    y:gy,
    m:gm + 1,
    d:gd
  };
}

/* =========================================================
   ADD MONTHS
========================================================= */

function jalaliDaysInMonth(y,m){

  if(m <= 6){
    return 31;
  }

  if(m <= 11){
    return 30;
  }

  var nextYearGregorian =
    jalaliToGregorian(
      y + 1,
      1,
      1
    );

  var currentYearGregorian =
    jalaliToGregorian(
      y,
      1,
      1
    );

  var date1 =
    Date.UTC(
      currentYearGregorian.y,
      currentYearGregorian.m - 1,
      currentYearGregorian.d
    );

  var date2 =
    Date.UTC(
      nextYearGregorian.y,
      nextYearGregorian.m - 1,
      nextYearGregorian.d
    );

  var days =
    Math.round(
      (date2 - date1) /
      86400000
    );

  return days === 366
    ? 30
    : 29;
}

function addJalaliMonths(dateString,months){

  var p =
    parseDateParts(dateString);

  if(!p){
    return "";
  }

  var total =
    p.y * 12 +
    (p.m - 1) +
    Number(months || 0);

  var y =
    Math.floor(total / 12);

  var m =
    total % 12 + 1;

  var maxDay =
    jalaliDaysInMonth(y,m);

  var d =
    Math.min(
      p.d,
      maxDay
    );

  return formatJalali(
    y,
    m,
    d
  );
}

/* =========================================================
   TODAY JALALI
========================================================= */

function todayJalali(){

  try{

    var formatter =
      new Intl.DateTimeFormat(
        "en-US-u-ca-persian",
        {
          year:"numeric",
          month:"2-digit",
          day:"2-digit",
          timeZone:"Asia/Tehran"
        }
      );

    var parts =
      formatter.formatToParts(
        new Date()
      );

    var y = "";
    var m = "";
    var d = "";

    for(
      var i = 0;
      i < parts.length;
      i++
    ){

      if(parts[i].type === "year"){
        y = parts[i].value;
      }

      if(parts[i].type === "month"){
        m = parts[i].value;
      }

      if(parts[i].type === "day"){
        d = parts[i].value;
      }

    }

    y = onlyAsciiNumbers(y);
    m = onlyAsciiNumbers(m);
    d = onlyAsciiNumbers(d);

    return formatJalali(
      Number(y),
      Number(m),
      Number(d)
    );

  }catch(e){

    var now =
      new Date();

    return gregorianToJalali(
      now.getFullYear(),
      now.getMonth() + 1,
      now.getDate()
    );
  }
}

/* =========================================================
   DISPLAY DATE
========================================================= */

function displayJalali(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "";
  }

  var s =
    String(value).trim();

  var p =
    parseDateParts(s);

  if(!p){
    return s;
  }

  if(
    p.y >= 1200 &&
    p.y <= 1600
  ){

    return formatJalali(
      p.y,
      p.m,
      p.d
    );

  }

  if(
    p.y >= 1900 &&
    p.y <= 2200
  ){

    return gregorianToJalali(
      p.y,
      p.m,
      p.d
    );
  }

  return s;
}

/* =========================================================
   NORMALIZE DATE
========================================================= */

function normalizeDateForStorage(value){

  if(!value){
    return "";
  }

  var p =
    parseDateParts(value);

  if(!p){
    return "";
  }

  if(
    p.y >= 1200 &&
    p.y <= 1600
  ){

    return formatJalali(
      p.y,
      p.m,
      p.d
    );
  }

  if(
    p.y >= 1900 &&
    p.y <= 2200
  ){

    return gregorianToJalali(
      p.y,
      p.m,
      p.d
    );
  }

  return "";
}

/* =========================================================
   DATE SERIAL
========================================================= */

function jalaliSerial(value){

  var p =
    parseDateParts(
      displayJalali(value)
    );

  if(!p){
    return 0;
  }

  var days =
    p.y * 365;

  if(p.m <= 6){

    days +=
      (p.m - 1) * 31;

  }else{

    days +=
      186 +
      (p.m - 7) * 30;

  }

  days += p.d;

  return days;
}

/* =========================================================
   STATUS
========================================================= */

function getStatus(c){

  if(!c.next_service){

    return {
      text:"⚪ تاریخ مشخص نیست",
      cls:""
    };

  }

  var today =
    jalaliSerial(
      todayJalali()
    );

  var dueDate =
    displayJalali(
      c.next_service
    );

  var due =
    jalaliSerial(
      dueDate
    );

  var diff =
    due - today;

  if(diff > 7){

    return {
      text:"🟢 موعد نرسیده",
      cls:"green"
    };

  }

  if(diff > 0){

    return {
      text:"🟡 کمتر از ۷ روز مانده",
      cls:"yellow"
    };

  }

  var oneMonthLater =
    jalaliSerial(
      addJalaliMonths(
        dueDate,
        1
      )
    );

  if(today < oneMonthLater){

    return {
      text:"🔴 موعد رسیده",
      cls:"red"
    };

  }

  return {
    text:"🟠 یک ماه گذشته",
    cls:"orange"
  };
}

function isLate(c){

  if(!c.next_service){
    return false;
  }

  var today =
    jalaliSerial(
      todayJalali()
    );

  var dueDate =
    displayJalali(
      c.next_service
    );

  var oneMonthLater =
    jalaliSerial(
      addJalaliMonths(
        dueDate,
        1
      )
    );

  return today >= oneMonthLater;
}

/* =========================================================
   INDEXED DB
========================================================= */

function openDB(){

  return new Promise(
    function(resolve,reject){

      var request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        function(event){

          var db =
            event.target.result;

          if(
            !db.objectStoreNames.contains(
              "customers"
            )
          ){

            db.createObjectStore(
              "customers",
              {
                keyPath:"id"
              }
            );
          }

          if(
            !db.objectStoreNames.contains(
              "history"
            )
          ){

            db.createObjectStore(
              "history",
              {
                keyPath:"id"
              }
            );
          }

          if(
            !db.objectStoreNames.contains(
              "queue"
            )
          ){

            db.createObjectStore(
              "queue",
              {
                keyPath:"id",
                autoIncrement:true
              }
            );
          }
        };

      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };

      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );
}

async function dbPut(storeName,data){

  var db =
    await openDB();

  return new Promise(
    function(resolve,reject){

      var tx =
        db.transaction(
          storeName,
          "readwrite"
        );

      tx.objectStore(
        storeName
      ).put(data);

      tx.oncomplete =
        function(){
          resolve();
        };

      tx.onerror =
        function(){
          reject(tx.error);
        };

    }
  );
}

async function dbGetAll(storeName){

  var db =
    await openDB();

  return new Promise(
    function(resolve,reject){

      var tx =
        db.transaction(
          storeName,
          "readonly"
        );

      var request =
        tx.objectStore(
          storeName
        ).getAll();

      request.onsuccess =
        function(){

          resolve(
            request.result || []
          );

        };

      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );
}

async function dbClear(storeName){

  var db =
    await openDB();

  return new Promise(
    function(resolve,reject){

      var tx =
        db.transaction(
          storeName,
          "readwrite"
        );

      tx.objectStore(
        storeName
      ).clear();

      tx.oncomplete =
        function(){
          resolve();
        };

      tx.onerror =
        function(){
          reject(tx.error);
        };

    }
  );
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  var s =
    String(value);

  s =
    s.split("&").join("&amp;");

  s =
    s.split("<").join("&lt;");

  s =
    s.split(">").join("&gt;");

  s =
    s.split('"').join("&quot;");

  s =
    s.split("'").join("&#039;");

  return s;
}

/* =========================================================
   CUSTOMER ID SAFE
========================================================= */

function safeId(value){

  return String(value)
    .split("\\").join("\\\\")
    .split("'").join("\\'");
}

function setFilter(filter){

    "filterAll",
    "filterDue",
    "filterNear",
    "filterLate"
  ];

  for(
    var i = 0;
    i < ids.length;
    i++
  ){

    document
      .getElementById(
        ids[i]
      )
      .classList.remove(
        "active"
      );
  }

  var selected =
    "filterAll";

  if(filter === "due"){
    selected = "filterDue";
  }

  if(filter === "near"){
    selected = "filterNear";
  }

  if(filter === "late"){
    selected = "filterLate";
  }

  document
    .getElementById(
      selected
    )
    .classList.add(
      "active"
    );

  renderCustomers();
}

/* =========================================================
   REPLACE LOCAL HISTORY

   فقط آخرین سرویس قبلی مشتری نگه داشته می‌شود.
   سابقه مشتری‌های دیگر دست‌نخورده می‌ماند.
========================================================= */

async function replaceLocalHistoryForCustomer(
  customerId,
  previousService
){

  var allHistory =
    await dbGetAll(
      "history"
    );

  var newHistory = [];

  for(
    var i = 0;
    i < allHistory.length;
    i++
  ){

    if(
      String(
        allHistory[i].customer_id
      ) !==
      String(customerId)
    ){

      newHistory.push(
        allHistory[i]
      );
    }
  }

  if(previousService){

    newHistory.push(
      previousService
    );
  }

  await dbClear(
    "history"
  );

  for(
    var j = 0;
    j < newHistory.length;
    j++
  ){

    await dbPut(
      "history",
      newHistory[j]
    );
  }

  serviceHistory =
    newHistory;
}

/* =========================================================
   REGISTER SERVICE

   منطق:
   سرویس جدید = آخرین سرویس فعلی مشتری
   وارد سابقه می‌شود.
   خود سرویس جدید فقط در customers ثبت می‌شود.
========================================================= */

async function registerService(){
  var customerId=document.getElementById("serviceCustomerId").value;
  var serviceDate=normalizeDateForStorage(document.getElementById("serviceDate").value);
  var tds=document.getElementById("serviceTds").value;
  var interval=Number(document.getElementById("serviceIntervalModal").value);
  if(!serviceDate){alert("تاریخ سرویس را وارد کنید.");return;}
  var nextService=addJalaliMonths(serviceDate,interval);
  var customer=customers.find(function(x){return String(x.id)===String(customerId);});
  if(!customer){alert("مشتری پیدا نشد.");return;}
  var previousService=null;
  if(customer.last_service){previousService={id:"history-"+String(customerId)+"-"+String(customer.last_service),customer_id:customerId,service_date:normalizeDateForStorage(customer.last_service),tds:customer.last_tds===undefined||customer.last_tds===null||customer.last_tds===""?null:Number(customer.last_tds),service_interval:Number(customer.service_interval||3)};}
  await replaceLocalHistoryForCustomer(customerId,previousService);
  customer.last_service=serviceDate; customer.next_service=nextService; customer.service_interval=interval; customer.last_tds=tds===""?null:Number(tds);
  await dbPut("customers",customer);
  customers=await dbGetAll("customers"); serviceHistory=await dbGetAll("history");
  closeModal("serviceModal"); renderCustomers();
  alert("سرویس با موفقیت در حافظه دستگاه ذخیره شد.\n\nموعد بعدی: "+nextService);
}

/* =========================================================
   DELETE
========================================================= */

async function deleteCustomer(id){
  var c=customers.find(function(x){return String(x.id)===String(id);});
  if(!c)return;
  if(!confirm("آیا از حذف «"+(c.Name||"")+"» مطمئن هستید؟"))return;

  try{
    var db=await openDB();
    var customerKey=c.id;

    await new Promise(function(resolve,reject){
      var tx=db.transaction(["customers","history"],"readwrite");
      var customerStore=tx.objectStore("customers");
      var historyStore=tx.objectStore("history");

      customerStore.delete(customerKey);

      var req=historyStore.getAll();
      req.onsuccess=function(){
        var list=req.result||[];
        for(var i=0;i<list.length;i++){
          if(String(list[i].customer_id)===String(customerKey)){
            historyStore.delete(list[i].id);
          }
        }
      };

      req.onerror=function(){reject(req.error||new Error("خطا در خواندن سابقه"));};
      tx.oncomplete=function(){resolve();};
      tx.onerror=function(){reject(tx.error||new Error("خطا در حذف مشتری"));};
      tx.onabort=function(){reject(tx.error||new Error("عملیات حذف لغو شد"));};
    });

    customers=await dbGetAll("customers");
    serviceHistory=await dbGetAll("history");
    renderCustomers();
  }catch(e){

async function exportBackup(){
  var data={app:"مدیریت فیلتر لطف آبادی",version:"standalone-1.0",exported_at:new Date().toISOString(),customers:await dbGetAll("customers"),history:await dbGetAll("history")};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="lotfabadi-backup-"+todayJalali().replaceAll("/","-")+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);
  alert("بکاپ با موفقیت ساخته شد.");
}
async function importBackup(file){
  if(!file)return;
  try{
    var data=JSON.parse(await file.text());
    if(!data||!Array.isArray(data.customers)||!Array.isArray(data.history))throw new Error("فرمت بکاپ معتبر نیست");
    if(!confirm("اطلاعات فعلی برنامه با این بکاپ جایگزین شود؟"))return;

    var cleanCustomers=[];
    for(var i=0;i<data.customers.length;i++){
      var c=Object.assign({},data.customers[i]);
      if(c.id===undefined||c.id===null||String(c.id)==="") c.id="local-"+Date.now()+"-"+i;
      c.id=String(c.id);
      cleanCustomers.push(c);
    }

    var cleanHistory=[];
    for(var j=0;j<data.history.length;j++){
      var h=Object.assign({},data.history[j]);
      if(h.id===undefined||h.id===null||String(h.id)==="") h.id="history-"+Date.now()+"-"+j;
      h.id=String(h.id);
      if(h.customer_id!==undefined&&h.customer_id!==null) h.customer_id=String(h.customer_id);
      cleanHistory.push(h);
    }

    await dbClear("customers");
    await dbClear("history");
    for(var k=0;k<cleanCustomers.length;k++) await dbPut("customers",cleanCustomers[k]);
    for(var m=0;m<cleanHistory.length;m++) await dbPut("history",cleanHistory[m]);

    customers=await dbGetAll("customers");
    serviceHistory=await dbGetAll("history");
    renderCustomers();
    alert("بکاپ با موفقیت بازیابی شد.\n\nتعداد مشتریان: "+customers.length);
  }catch(e){
    alert("خطا در بازیابی بکاپ: "+(e.message||e));
  }finally{
    var input=document.getElementById("importFile");
    if(input)input.value="";
  }
}
